name: Build Mna APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore optional persistent debug key
        env:
          MGE_KEY: ${{ secrets.MGE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MGE_KEY" ]; then
            mkdir -p ~/.android
            printf '%s' "$MGE_KEY" | base64 -d > ~/.android/debug.keystore
          fi
      - name: Unpack mobile update if present
        shell: python
        run: |
          import os, pathlib, zipfile
          root = pathlib.Path('.mna-build').resolve()
          payload = pathlib.Path('mna-update.zip')
          if payload.exists():
              with zipfile.ZipFile(payload) as z:
                  if sum(i.file_size for i in z.infolist()) > 100_000_000:
                      raise RuntimeError('Update archive too large')
                  for i in z.infolist():
                      target = (root / i.filename).resolve()
                      if not target.is_relative_to(root):
                          raise RuntimeError('Unsafe archive path')
                  z.extractall(root)
              project = root / 'Mna-OS'
              if not (project / 'settings.gradle').exists():
                  raise RuntimeError('Expected Mna-OS/settings.gradle in archive')
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('MNA_PROJECT=' + str(project) + '\n')
          else:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('MNA_PROJECT=' + str(pathlib.Path('.').resolve()) + '\n')
      - name: Build debug APK
        run: gradle --no-daemon -p "$MNA_PROJECT" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MnaLauncher-debug-APK
          path: ${{ env.MNA_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
