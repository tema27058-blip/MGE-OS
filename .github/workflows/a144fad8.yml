name: Build MGE OS Glass APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mna-native-debug-key-v1

      - name: Configure signing
        env:
          KEY_BASE64: ${{ secrets.MNA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEY_BASE64" ]; then
            printf '%s' "$KEY_BASE64" | base64 -d > ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify glass add-on
        run: node --check app/src/main/assets/mge-glass.js

      - name: Install add-on and build
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=""
          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [ -f "$DIR/app/src/main/java/com/mna/launcher/MainActivity.java" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find . -maxdepth 4 -name settings.gradle -type f)

          if [ -z "$PROJECT" ]; then
            echo "::error::Не найдены распакованные исходники Mna OS. Загрузите содержимое архива 2.0, а не ZIP."
            exit 1
          fi

          echo "Building project: $PROJECT"
          python3 tools/install_glass_addon.py
          gradle --no-daemon --console=plain \
            -p "$PROJECT" :app:assembleDebug

          mkdir -p apk-output
          cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" \
            apk-output/MGE-OS-Glass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MGE-OS-Glass-APK
          path: apk-output/MGE-OS-Glass.apk
          if-no-files-found: error
