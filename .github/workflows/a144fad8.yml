name: Build Mna 2.2 Preview
on:
  workflow_dispatch:
  push:
    branches: [main, mna/glass-refinement]
permissions:
  contents: read
concurrency:
  group: mna-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Regression test for pages
        run: |
          mkdir -p "$RUNNER_TEMP/page-tests"
          javac -d "$RUNNER_TEMP/page-tests" app/src/main/java/com/mna/launcher/PagePolicy.java tests/PagePolicyTest.java
          java -cp "$RUNNER_TEMP/page-tests" PagePolicyTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mna-native-debug-key-v1
      - name: Restore signing secret
        env:
          KEY_BASE64: ${{ secrets.MNA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEY_BASE64" ]; then
            printf '%s' "$KEY_BASE64" | base64 -d > ~/.android/debug.keystore
          fi
      - name: Prepare native source
        run: |
          python3 tools/refine_ui.py
          python3 tools/stability22.py
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee build-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mna-2.2-Candidate-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mna-2.2-build-log
          path: build-log.txt
          if-no-files-found: ignore
