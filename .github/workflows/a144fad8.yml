name: Build MnaLauncher APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: mna-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mna-native-debug-key-v1
      - name: Configure debug signing
        env:
          KEY_BASE64: ${{ secrets.MNA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEY_BASE64" ]; then
            printf '%s' "$KEY_BASE64" | base64 -d > ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Unpack uploaded source
        run: |
          test -f MnaLauncher-source.zip || { echo "Upload MnaLauncher-source.zip to repository root first"; exit 1; }
          mkdir -p "$RUNNER_TEMP/mna-source"
          unzip -q MnaLauncher-source.zip -d "$RUNNER_TEMP/mna-source"
          test -f "$RUNNER_TEMP/mna-source/settings.gradle"
      - name: Build APK
        run: gradle --no-daemon -p "$RUNNER_TEMP/mna-source" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MnaLauncher-APK
          path: ${{ runner.temp }}/mna-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
